name: scriby_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2
  flutter: ">=3.38.0 <3.39.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  shared_preferences: ^2.3.1
  talker_flutter: ^5.1.14
  go_router: ^17.1.0
  realm: ^20.2.0
  equatable: ^2.0.5
  flutter_animate: ^4.5.0
  uuid: ^4.4.2
  intl: ^0.20.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_staggered_animations: ^1.1.1
  stream_transform: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.15
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/Product Sans 400.ttf
        - asset: assets/fonts/Product Sans Bold 700.ttf